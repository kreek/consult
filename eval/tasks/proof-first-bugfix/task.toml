schema_version = "1.3"

[task]
name = "consult/proof-first-bugfix"
description = "Improve a small maintenance change and leave executable evidence."

[metadata]
kind = "code"
features = ["workflow", "proof", "domain-modeling", "refactoring"]

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 600.0

[verifier.env]
CLAUDE_CODE_OAUTH_TOKEN = "${CLAUDE_CODE_OAUTH_TOKEN:-}"
REWARDKIT_FORCE_SUBSCRIPTION = "${REWARDKIT_FORCE_SUBSCRIPTION:-1}"
REWARDKIT_JUDGE = "${CONSULT_EVAL_JUDGE:-claude-code}"
