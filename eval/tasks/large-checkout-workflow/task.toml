schema_version = "1.3"

[task]
name = "consult/large-checkout-workflow"
description = "Harden a multi-module checkout workflow without changing the public shape."

[metadata]
kind = "code"
features = ["workflow", "domain-modeling", "architecture", "api", "security", "database", "error-handling", "observability", "release", "proof", "code-review", "documentation"]

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 600.0

[verifier.env]
CLAUDE_CODE_OAUTH_TOKEN = "${CLAUDE_CODE_OAUTH_TOKEN:-}"
REWARDKIT_FORCE_SUBSCRIPTION = "${REWARDKIT_FORCE_SUBSCRIPTION:-1}"
REWARDKIT_JUDGE = "${CONSULT_EVAL_JUDGE:-claude-code}"
