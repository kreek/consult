schema_version = "1.3"

[task]
name = "consult/scaffold-repo-workflow"
description = "Set up a small package for repeatable maintenance work."

[metadata]
kind = "code"
features = ["scaffolding", "git-workflow", "documentation", "proof"]

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 600.0

[verifier.env]
CLAUDE_CODE_OAUTH_TOKEN = "${CLAUDE_CODE_OAUTH_TOKEN:-}"
REWARDKIT_FORCE_SUBSCRIPTION = "${REWARDKIT_FORCE_SUBSCRIPTION:-1}"
REWARDKIT_JUDGE = "${CONSULT_EVAL_JUDGE:-claude-code}"
