# `eval/` is deliberately NOT a workspace package. It depends on `do-eval` via
# `file:../../do-eval`, an unpublished sibling checkout, so including it here made
# a bare `pnpm install` fail with ENOENT and install nothing — taking root
# `vitest` and `remark` down with it. Install the eval suite from `eval/` itself
# once the sibling is checked out beside this repo.
packages:
  - consult

# Delay fresh registry publishes to reduce supply-chain blast radius.
# 1440 minutes = 24 hours.
minimumReleaseAge: 1440

# Block transitive deps from resolving exotic sources (git+ssh:, https: tarballs);
# only direct dependencies may use them. Matches the pnpm 11.0 default.
blockExoticSubdeps: true
