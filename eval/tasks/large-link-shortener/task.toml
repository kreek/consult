schema_version = "1.3"

[task]
name = "consult/large-link-shortener"
description = "Build a small link-shortener app from an empty scaffold; SQLite + HTMX + Alpine."

[metadata]
kind = "code"
features = ["scaffolding", "architecture", "domain-modeling", "api", "security", "proof", "ui-design"]

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 600.0

[verifier.env]
CLAUDE_CODE_OAUTH_TOKEN = "${CLAUDE_CODE_OAUTH_TOKEN:-}"
REWARDKIT_FORCE_SUBSCRIPTION = "${REWARDKIT_FORCE_SUBSCRIPTION:-1}"
REWARDKIT_JUDGE = "${CONSULT_EVAL_JUDGE:-claude-code}"
